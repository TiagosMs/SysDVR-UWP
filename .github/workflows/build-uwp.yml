name: Build SysDVR UWP (Xbox Dev Mode)

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

env:
  SDL2_VERSION: "2.30.0"
  FFMPEG_VERSION: "7.0.0"
  VCPKG_DEFAULT_BINARY_CACHE: "${{ github.workspace }}/.vcpkg-bincache"

jobs:
  build:
    name: Build x64 UWP AppX
    runs-on: windows-2022

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup MSVC & UWP Dev Environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          uwp: true

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Resolve Windows SDK Paths
        shell: pwsh
        run: |
          $kitsLib = "C:\Program Files (x86)\Windows Kits\10\Lib"
          $targetSdk = "10.0.22621.0"
          if (-not (Test-Path "$kitsLib\$targetSdk\um\x64")) {
            $targetSdk = (Get-ChildItem $kitsLib | Where-Object { Test-Path "$($_.FullName)\um\x64" } | Sort-Object Name -Descending | Select-Object -First 1).Name
          }
          
          $sdkLibPath = "$kitsLib\$targetSdk\um"
          Write-Host "Selected Windows SDK: $targetSdk"
          Write-Host "TargetPlatformSDKLibPath: $sdkLibPath"
          
          "WINDOWS_SDK_VERSION=$targetSdk" | Out-File -FilePath $env:GITHUB_ENV -Append
          "SDK_LIB_PATH=$sdkLibPath" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Restore Native Dependencies Cache
        id: native-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            NativeLibs/x64
            .vcpkg-bincache
          key: native-deps-${{ runner.os }}-x64-v2-${{ env.SDL2_VERSION }}-${{ env.FFMPEG_VERSION }}-${{ hashFiles('.github/scripts/install-native-deps.ps1', 'triplets/x64-uwp-dynamic.cmake') }}
          restore-keys: |
            native-deps-${{ runner.os }}-x64-v2-${{ env.SDL2_VERSION }}-${{ env.FFMPEG_VERSION }}-

      - name: Build / Install Native Dependencies (SDL2 + FFmpeg)
        if: steps.native-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          & .github/scripts/install-native-deps.ps1 -DestinationDir "NativeLibs/x64"

      - name: Save Native Dependencies Cache
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            NativeLibs/x64
            .vcpkg-bincache
          key: native-deps-${{ runner.os }}-x64-v2-${{ env.SDL2_VERSION }}-${{ env.FFMPEG_VERSION }}-${{ hashFiles('.github/scripts/install-native-deps.ps1', 'triplets/x64-uwp-dynamic.cmake') }}

      - name: Restore NuGet packages
        run: |
          nuget restore SysDVR.UWP.sln
          msbuild SysDVR.UWP.csproj /t:Restore /p:TargetPlatformVersion=${{ env.WINDOWS_SDK_VERSION }} /p:TargetPlatformMinVersion=10.0.19041.0

      - name: Generate Self-Signed Certificate for Xbox
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate `
            -Type Custom `
            -Subject "CN=SysDVR-Dev" `
            -KeyUsage DigitalSignature `
            -FriendlyName "SysDVR Dev" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")

          $pwd = ConvertTo-SecureString -String "SysDVRPass123!" -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath "SysDVR_Dev.pfx" -Password $pwd
          Export-Certificate -Cert $cert -FilePath "SysDVR_Dev.cer"

      - name: Build UWP AppX Package
        run: |
          msbuild SysDVR.UWP.csproj `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:TargetPlatformVersion=${{ env.WINDOWS_SDK_VERSION }} `
            /p:TargetPlatformMinVersion=10.0.19041.0 `
            /p:TargetPlatformSDKLibPath="${{ env.SDK_LIB_PATH }}" `
            /p:AppxBundle=Never `
            /p:AppxPackageDir=AppPackages\ `
            /p:UapAppxPackageBuildMode=SideloadOnly `
            /p:AppxPackageSigningEnabled=true `
            /p:PackageCertificateKeyFile=SysDVR_Dev.pfx `
            /p:PackageCertificatePassword=SysDVRPass123! `
            /p:UseDotNetNativeToolchain=false

      - name: Verify AppX Package Native Dependencies
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $pkg = Get-ChildItem AppPackages -Recurse -Include *.msix,*.appx | Select-Object -First 1
          if (-not $pkg) {
            throw "Nenhum pacote .msix ou .appx encontrado em AppPackages."
          }
          Write-Host "Verificando conteudo do pacote: $($pkg.FullName)"
          $zip = [IO.Compression.ZipFile]::OpenRead($pkg.FullName)
          $names = $zip.Entries.Name
          $zip.Dispose()
          Write-Host "Arquivos presentes no pacote:"
          $names | Sort-Object | ForEach-Object { Write-Host " - $_" }

          if (-not ($names -contains "SDL2.dll")) {
            throw "Faltou SDL2.dll no pacote"
          }
          foreach ($lib in 'avcodec','avutil','swscale','swresample') {
            if (-not ($names -match "^$lib(-\d+)?\.dll$")) {
              throw "Faltou $lib no pacote"
            }
          }
          Write-Host "Verificacao de DLLs nativas concluida com sucesso!"

      - name: Upload AppX Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SysDVR-UWP-Xbox-x64
          path: |
            AppPackages/**/*.appx
            AppPackages/**/*.msix
            AppPackages/**/*.cer
            SysDVR_Dev.cer
