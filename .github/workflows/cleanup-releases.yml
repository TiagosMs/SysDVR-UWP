name: Cleanup Old Releases

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    name: Prune Legacy Releases
    runs-on: ubuntu-latest
    steps:
      - name: Delete Old Releases (Keep v1.3.0)
        uses: actions/github-script@v7
        with:
          script: |
            const tagsToPrune = [
              'v1.0.0',
              'v1.0.1',
              'v1.1.0',
              'v1.1.1',
              'v1.2.0',
              'v1.2.1',
              'v1.2.2',
              'v1.3.0'
            ];

            const releases = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });

            console.log(`Encontradas ${releases.data.length} releases no repositório.`);

            for (const r of releases.data) {
              if (tagsToPrune.includes(r.tag_name)) {
                console.log(`Excluindo release obsoleta: ${r.tag_name} (ID: ${r.id})`);
                try {
                  await github.rest.repos.deleteRelease({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    release_id: r.id
                  });
                  console.log(`✅ Release ${r.tag_name} excluída com sucesso.`);
                } catch (err) {
                  console.error(`❌ Erro ao excluir release ${r.tag_name}: ${err.message}`);
                }

                try {
                  await github.rest.git.deleteRef({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    ref: `tags/${r.tag_name}`
                  });
                  console.log(`✅ Tag remota ${r.tag_name} removida.`);
                } catch (err) {
                  console.log(`ℹ️ Tag ${r.tag_name} não precisou de remoção de ref: ${err.message}`);
                }
              }
            }

            console.log('Limpeza de releases concluída. Apenas a versão estável mais recente permanece disponível!');
